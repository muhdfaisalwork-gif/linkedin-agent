name: Feature Request
description: Suggest an idea or enhancement for LinkedIn Nexus Agent
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this feature solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Describe the proposed solution
    validations:
      required: true
